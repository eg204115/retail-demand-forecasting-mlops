name: Drift check

on:
  schedule:
    - cron: "0 6 * * *"     # daily, before the replenishment run
  workflow_dispatch:

permissions:
  contents: read
  actions: write            # needed to trigger the training workflow
  issues: write
  id-token: write           # OIDC federation - no long-lived AWS keys in secrets

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TRAINING_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: pip install -e ".[monitoring,dev]"

      # The feature table is not in the repo (data/** is gitignored), so a scheduled
      # run has to fetch it. Without this the check dies on a missing path, which is
      # a broken pipeline rather than a drift signal.
      - name: Fetch the feature table
        run: |
          test -n "${DATA_URI}" || {
            echo "::error::DATA_URI is not set - the drift check has no feature table to read."
            echo "Set the DATA_URI repository variable to the feature table location."
            exit 1
          }
          aws s3 sync "${DATA_URI}" data/features/sales_features --only-show-errors
        env:
          DATA_URI: ${{ vars.DATA_URI }}

      # Exit 2 means the gate tripped; 1 means the check could not run. Both are
      # non-zero, so the outcome is captured here and the verdict is read from the
      # step outputs below rather than inferred from red or green.
      - name: Run the drift report
        id: drift
        continue-on-error: true
        run: python -m src.monitoring.drift --config conf/config.yaml

      # No outputs means the module never reached its conclusion. That is a failure
      # to report on drift, not a report of no drift, and it stops the job here.
      # Checked before the upload so this message is the one that fails the run,
      # rather than a confusing "no files found" from an empty report directory.
      - name: Fail when the drift check could not run
        if: steps.drift.outputs.retrain_recommended == ''
        run: |
          echo "::error::The drift check did not complete - see 'Run the drift report'."
          exit 1

      # always(), so a failed run still uploads whatever it managed to write.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-report-${{ github.run_number }}
          path: artifacts/reports/
          if-no-files-found: warn

      - name: Open an issue when the gate trips
        if: steps.drift.outputs.retrain_recommended == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync('artifacts/reports/drift_summary.json', 'utf8'));
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Drift detected: ${(s.drift_share * 100).toFixed(0)}% of features moved`,
              labels: ['drift', 'ml-ops'],
              body: [
                `**Drifted features:** ${s.drifted_features.join(', ') || 'none'}`,
                `**Drift share:** ${s.drift_share}`,
                `**Live WMAPE:** ${s.live_wmape ?? 'n/a'} (training: ${s.training_wmape ?? 'n/a'})`,
                '',
                `Report artifact: run #${context.runNumber}.`,
                'Retraining has been triggered automatically.',
              ].join('\n'),
            });

      # Input drift alone does not justify a retrain (holidays move features every
      # year); the module only recommends one when performance also degrades.
      - name: Trigger retraining
        if: steps.drift.outputs.retrain_recommended == 'true'
        run: gh workflow run train.yml --ref ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
