name: Deploy serving

on:
  push:
    branches: [main]
    paths:
      - "src/serving/**"
      - "docker/Dockerfile.serving"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.AWS_REGION != ''
    environment: ${{ inputs.environment || 'staging' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          # Tag by commit SHA, never :latest - a rollback needs an addressable image.
          TAG: ${{ github.sha }}
        run: |
          docker build -f docker/Dockerfile.serving -t "$REGISTRY/$ECR_REPOSITORY:$TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"

      - name: Smoke test the image before it reaches the cluster
        run: |
          docker run -d --name smoke -p 8000:8000 -e MODEL_NAME=none "${{ steps.image.outputs.uri }}"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          docker rm -f smoke

      - name: Deploy to ECS
        id: ecs
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --query 'service.deployments[0].id' --output text
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      # Only meaningful once ECS was actually told to deploy. Without this guard a
      # credentials failure triggers a "rollback" that has nothing to roll back to,
      # turning one red step into three.
      - name: Roll back on failure
        if: failure() && steps.ecs.outcome == 'failure'
        run: |
          echo "::error::Deployment failed - rolling back to the previous task definition"
          PREVIOUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].deployments[1].taskDefinition' --output text)
          if [ "$PREVIOUS" != "None" ]; then
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
              --task-definition "$PREVIOUS"
          fi
