name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff mypy types-PyYAML
      - name: Ruff
        run: |
          ruff check src tests pipelines
          ruff format --check src tests
      - name: Mypy
        run: mypy src --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # PySpark needs a JVM; without this the transform tests silently skip and the
      # leakage guarantees stop being enforced.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[spark,serving,monitoring,dev]"
      - name: Pytest
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  smoke-pipeline:
    # End-to-end on synthetic data: proves ingest -> features -> train still wires up.
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[spark,monitoring,dev]"
      - name: Generate sample data
        run: python -m src.ingestion.download --sample
      - name: Bronze
        run: python -m src.ingestion.to_bronze --config conf/config.yaml
      - name: Features
        run: python -m src.features.build_features --config conf/config.yaml
      - name: Validate feature contract
        run: python -m tests.data_quality.validate --layer features
      - name: Train against a local file-backed tracking store
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: python -m src.training.train --config conf/config.yaml --run-name ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-reports
          path: artifacts/reports/

  build-image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build serving image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.serving
          push: false
          tags: shelfcast-serving:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
