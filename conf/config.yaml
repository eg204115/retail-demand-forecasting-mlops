project: shelfcast
seed: 42

paths:
  raw: data/raw
  bronze: data/bronze
  silver: data/silver
  features: data/features
  artifacts: artifacts
  reports: artifacts/reports

spark:
  app_name: shelfcast-features
  master: "local[*]"
  # Tuned in docs/spark-optimisation.md - do not change without re-running the benchmark.
  shuffle_partitions: 200
  driver_memory: 8g
  executor_memory: 8g
  broadcast_threshold_mb: 64
  adaptive_enabled: true
  skew_join_enabled: true
  # Store ids whose row counts dominate the join; salted to spread the shuffle.
  skewed_keys: ["CA_1", "CA_3"]
  salt_buckets: 16

data:
  dataset: m5
  # Forecast the next `horizon` days for every (store_id, item_id).
  horizon: 14
  lags: [1, 7, 14, 28]
  rolling_windows: [7, 28, 91]
  # Rolling-origin backtest: each fold shifts the origin forward by `fold_step` days.
  backtest_folds: 3
  fold_step: 28
  valid_days: 28
  test_days: 28

model:
  name: lightgbm_quantile
  # P50 drives the point forecast, P90 sizes the safety stock.
  quantiles: [0.5, 0.9]
  params:
    objective: quantile
    metric: quantile
    learning_rate: 0.05
    num_leaves: 128
    min_data_in_leaf: 100
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    num_boost_round: 2000
    early_stopping_round: 100
    verbosity: -1

mlflow:
  # Env wins so CI can point at a file store and a cluster job at the real server,
  # without a config edit becoming part of every deployment.
  tracking_uri: ${MLFLOW_TRACKING_URI:-http://localhost:5000}
  experiment: shelfcast-demand
  registered_model: shelfcast-demand-forecaster

promotion:
  primary_metric: wmape          # lower is better
  # A candidate must beat production by at least this much to be promoted.
  min_improvement_pct: 0.5
  # Hard floor - never promote a model worse than the seasonal-naive baseline.
  must_beat_baseline: true

inventory:
  service_level: 0.95
  lead_time_days: 3
  review_period_days: 7
  unit_holding_cost: 0.02

monitoring:
  reference_window_days: 28
  # Fail the drift gate when more than this share of features drift.
  drift_share_threshold: 0.3
  # Fail the performance gate when live WMAPE degrades by more than this.
  wmape_degradation_threshold: 0.15
